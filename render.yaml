# Declarative configuration only. Nothing here provisions resources by itself.
# Free Render web services sleep; free PostgreSQL expires after 30 days.
services:
  - type: web
    name: btc-tamagochi
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: BLOCK_API_BASE_URL
        value: https://blockstream.info/api
      - key: DISABLE_BLOCK_WORKER
        value: "false"
      - key: MODERATOR_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: btc-tamagochi
          property: connectionString

databases:
  - name: btc-tamagochi
    plan: free
    postgresMajorVersion: "16"
