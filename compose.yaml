services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: btc_tamagochi
    ports:
      - "5432:5432"
    volumes:
      - btc-tamagochi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btc_tamagochi"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  btc-tamagochi-postgres:
